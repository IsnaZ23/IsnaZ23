<svg xmlns="http://www.w3.org/2000/svg" width="600" height="150" viewBox="0 0 600 150" role="img" aria-label="Dino loncat" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .card  { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
    .ink   { fill: #e6edf3; }
    .eye   { fill: #0d1117; }
    .ground{ stroke: #e6edf3; stroke-width: 2; stroke-dasharray: 22 10 4 16 8 12; animation: scroll 1.3s linear infinite; }
    .hint  { fill: #8b949e; font: 11px monospace; }

    .dino   { animation: jump 2.6s infinite; }
    .cactus { animation: run 2.6s linear infinite; }
    .legA   { animation: stepA 0.3s steps(1) infinite; }
    .legB   { animation: stepB 0.3s steps(1) infinite; }

    @keyframes jump {
      0%, 74% { transform: translateY(0);     animation-timing-function: ease-out; }
      85%     { transform: translateY(-62px); animation-timing-function: ease-in; }
      96%, 100% { transform: translateY(0); }
    }
    @keyframes run {
      from { transform: translateX(0); }
      to   { transform: translateX(-680px); }
    }
    @keyframes scroll {
      to { stroke-dashoffset: -72; }
    }
    @keyframes stepA { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes stepB { 0% { opacity: 0; } 50% { opacity: 1; } }
  </style>

  <rect class="card" x="0.5" y="0.5" width="599" height="149" rx="10"/>
  <text class="hint" x="20" y="22">G A M E   O V E R ?   nope, dia lompat terus :)</text>

  <!-- tanah -->
  <line class="ground" x1="0" y1="121" x2="600" y2="121"/>

  <!-- kaktus -->
  <g transform="translate(640,0)">
    <g class="cactus">
      <rect class="ink" x="6"  y="86" width="8" height="34"/>
      <rect class="ink" x="0"  y="90" width="4" height="10"/>
      <rect class="ink" x="0"  y="96" width="6" height="4"/>
      <rect class="ink" x="16" y="94" width="4" height="10"/>
      <rect class="ink" x="14" y="100" width="6" height="4"/>
    </g>
  </g>

  <!-- dino -->
  <g transform="translate(50,64)">
    <g class="dino">
      <!-- kepala -->
      <rect class="ink" x="22" y="0" width="24" height="16"/>
      <rect class="eye" x="36" y="3" width="3" height="3"/>
      <!-- leher + badan -->
      <rect class="ink" x="16" y="14" width="16" height="6"/>
      <rect class="ink" x="6"  y="18" width="30" height="26"/>
      <!-- tangan -->
      <rect class="ink" x="36" y="28" width="7" height="3"/>
      <!-- ekor -->
      <rect class="ink" x="0"  y="20" width="8" height="8"/>
      <!-- kaki frame A: kiri turun, kanan naik -->
      <g class="legA">
        <rect class="ink" x="10" y="44" width="6" height="12"/>
        <rect class="ink" x="10" y="52" width="10" height="4"/>
        <rect class="ink" x="26" y="44" width="6" height="6"/>
      </g>
      <!-- kaki frame B: kanan turun, kiri naik -->
      <g class="legB">
        <rect class="ink" x="26" y="44" width="6" height="12"/>
        <rect class="ink" x="26" y="52" width="10" height="4"/>
        <rect class="ink" x="10" y="44" width="6" height="6"/>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
